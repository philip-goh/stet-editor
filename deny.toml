# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# Run with `cargo deny check` or `just deny`.

[graph]
all-features = true

[advisories]
version = 2
# Fail the build on known vulnerabilities. Yanked crates are reported as
# warnings. Unmaintained-crate detection is limited to workspace members:
# advisories in GPUI's transitive dependencies (e.g. ttf-parser) are not
# actionable here and would only make CI noisy.
unmaintained = "workspace"
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.9
# Only permissive, OSI-approved licenses. When adding a dependency whose
# license is not listed, verify it and add it here in the same PR.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
